name: Build

on:
  push:
    branches: [ release, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: 'yarn'
    - run: yarn install
    - run: yarn test
    - run: yarn build
      env:
        NODE_ENV: production
